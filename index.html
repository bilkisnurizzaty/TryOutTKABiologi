<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendalaman TKA Biologi</title>
<style>
:root{--bg:#f3f1ff;--card:#fff;--text:#1f2340;--muted:#6b7090;--line:#e3e0f5;--pri:#5b4bdb;--pri2:#14b8a6;--ok:#16a34a;--okbg:#dcfce7;--warn:#f59e0b;--warnbg:#fef3c7;--bad:#e11d48;--badbg:#ffe4ea;--un:#e9e8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c3d;--text:#ecebff;--muted:#a3a1c9;--line:#35316a;--un:#322f5e;--okbg:#143d2a;--warnbg:#4a3a10;--badbg:#4a1a28}}
:root[data-theme="dark"]{--bg:#14122b;--card:#1f1c3d;--text:#ecebff;--muted:#a3a1c9;--line:#35316a;--un:#322f5e;--okbg:#143d2a;--warnbg:#4a3a10;--badbg:#4a1a28}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#5b4bdb,#14b8a6);color:#fff;border-radius:22px;padding:28px 22px;text-align:center}
.hero h1{margin:6px 0;font-size:1.7rem}.hero p{margin:0;opacity:.92}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 6px 20px rgba(91,75,219,.08)}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input:focus{outline:none;border-color:var(--pri)}
.btn{border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--pri)}
.btn.warn{background:var(--warn);color:#2b1d00}.btn.ghost{background:var(--un);color:var(--text)}.btn.big{width:100%;margin-top:18px;padding:14px;font-size:1.05rem;background:linear-gradient(135deg,#5b4bdb,#14b8a6)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.info{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.info span{background:var(--un);border-radius:999px;padding:5px 12px;font-size:.88rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,#5b4bdb,#14b8a6);color:#fff;border-radius:16px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar small{opacity:.9;display:block}.timer{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.22);padding:4px 14px;border-radius:12px}.timer.low{background:var(--bad);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.6}}
.grid{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.tag{display:inline-block;background:var(--un);color:var(--pri);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;margin-right:6px}
.q p{margin:.6em 0}.q .ask{font-weight:600}
.q img{max-width:100%;border-radius:12px;display:block;margin:10px auto}
table.t{border-collapse:collapse;margin:10px auto;max-width:100%;font-size:.92rem}table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:left}table.t th{background:var(--un)}
.wide{overflow-x:auto}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin:8px 0;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--pri2)}.opt.sel{border-color:var(--pri);background:rgba(91,75,219,.12)}
.opt input{width:auto;margin-top:5px;accent-color:var(--pri)}
.kat td.c{text-align:center;width:90px}.kat input{width:20px;height:20px;accent-color:var(--pri)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.num{border:2px solid transparent;border-radius:12px;padding:9px 0;font-weight:700;cursor:pointer;background:var(--un);color:var(--text);font:inherit;font-weight:700}
.num.ans{background:var(--ok);color:#fff}.num.flag{background:var(--warn);color:#2b1d00}.num.cur{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,75,219,.35)}
.leg{display:grid;gap:6px;margin-top:14px;font-size:.88rem}.leg i{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-3px;margin-right:6px}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal .card{max-width:420px;margin:0}
.score{width:170px;height:170px;border-radius:50%;margin:10px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(var(--pri2) calc(var(--p)*1%),var(--un) 0);position:relative}
.score:before{content:"";position:absolute;inset:14px;background:var(--card);border-radius:50%}.score b,.score span{position:relative}.score b{font-size:2.6rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.stats div{background:var(--un);border-radius:14px;padding:10px 18px;text-align:center}.stats b{display:block;font-size:1.3rem}
.rv{border-left:6px solid var(--line)}.rv.ok{border-left-color:var(--ok)}.rv.no{border-left-color:var(--bad)}
.badge{padding:3px 12px;border-radius:999px;font-size:.8rem;font-weight:700}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.no{background:var(--badbg);color:var(--bad)}
.kunci{background:var(--okbg);border-radius:12px;padding:10px 14px;margin:10px 0}.bahas{background:var(--un);border-radius:12px;padding:10px 14px}
.hide{display:none!important}.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.menu{grid-template-columns:1fr}}.foot{text-align:center;color:var(--muted);font-size:.85rem;padding:18px 16px}
@media print{.bar,.btn,.nonprint{display:none!important}.card{box-shadow:none;break-inside:avoid}}
</style></head><body><div class="wrap" id="app"></div><footer class="foot">Dikembangkan oleh <b>Bilkis Nur Izzaty, S.Pd.</b> • SMAN 2 Kalianda</footer>
<script>
const DATA1=[{"n": 1, "type": "MCMA", "el": "Keanekaragaman Hayati", "stem": ["Badak Jawa (*Rhinoceros sondaicus*) adalah spesies endemik Indonesia yang kini berstatus kritis dan hanya ditemukan di Taman Nasional Ujung Kulon. Populasinya terus menurun akibat pembangunan infrastruktur yang mengganggu habitat alaminya. Keragaman genetik yang rendah meningkatkan risiko penyakit dan menurunkan peluang kelangsungan hidup keturunannya. Selain itu, gangguan manusia seperti perburuan menyebabkan perubahan perilaku yang menghambat reproduksi."], "stem2": [], "ask": ["Dengan mencermati informasi tersebut, pernyataan manakah yang berkaitan dengan penurunan populasi Badak Jawa dan faktor penyebabnya?", "Klik pada setiap jawaban yang benar! Jawaban benar lebih dari satu."], "ans": [0, 1, 4], "ex": ["Penurunan populasi Badak Jawa dipicu oleh hilangnya habitat, perburuan, dan rendahnya keragaman genetik.", "**A (benar):** perburuan dilakukan untuk mengambil cula, sehingga perdagangan cula mengancam kelangsungan spesies.", "**B (benar):** pembangunan infrastruktur mengganggu habitat, yaitu deforestasi dan konversi lahan yang mengurangi ruang jelajah.", "**C (salah):** wacana tidak menyebut perubahan pola migrasi; badak hanya ditemukan di satu kawasan.", "**D (salah):** tidak ada informasi masuknya spesies lain yang meningkatkan kompetisi.", "**E (benar):** keragaman genetik rendah membuat badak sulit beradaptasi, rentan penyakit, dan keturunannya sulit bertahan."], "opts": ["Perdagangan cula yang mengancam keberlangsungan spesies Badak Jawa.", "Deforestasi dan konversi lahan yang mengurangi ruang jelajah Badak Jawa.", "Perubahan pola migrasi yang menyebabkan distribusi populasi lebih tersebar dan sulit dilacak.", "Gangguan ekosistem akibat masuknya spesies lain ke Ujung Kulon sehingga meningkatkan kompetisi.", "Minimnya variasi genetik membuat badak menjadi sulit beradaptasi dengan lingkungan sekitar."]}, {"n": 2, "type": "PG", "el": "Keanekaragaman Hayati", "stem": ["Produk pangan pada era modern banyak dikemas agar tetap awet dan higienis. Salah satu contohnya adalah produk ikan awetan. Namun, beberapa kasus keracunan masih terjadi akibat bakteri *Clostridium botulinum*. Produk ikan awetan yang terkontaminasi biasanya memiliki kemasan rusak atau bocor, bau menyengat, warna pudar, dan rasa tidak enak. Gejala keracunan yang muncul pada konsumen antara lain: masalah penglihatan, kelemahan otot, kesulitan menelan, mual, muntah, dan sakit perut. Keracunan ini dapat menyebabkan risiko kesehatan serius, termasuk gangguan sistem saraf dan bahkan kematian jika tidak ditangani dengan cepat. Kasus ini menunjukkan pentingnya pengolahan dan penyimpanan makanan yang tepat agar pertumbuhan bakteri berbahaya dapat dicegah."], "stem2": [], "ask": ["Berdasarkan informasi tersebut, mekanisme utama peran *Clostridium botulinum* dalam menyebabkan keracunan ikan awetan adalah ...."], "ans": 1, "ex": ["*Clostridium botulinum* menghasilkan toksin botulinum (neurotoksin) yang menghambat pelepasan asetilkolin di sambungan saraf-otot. Akibatnya sinyal saraf dan kontraksi otot terganggu sehingga muncul gangguan penglihatan, otot lemah, dan sulit menelan. Opsi A, D, dan E tidak sesuai mekanisme toksin; opsi C keliru karena bakteri tidak menyerap komponen ikan ke dinding sel."], "opts": ["menguraikan protein dan lemak dalam ikan menjadi senyawa berbahaya sehingga menimbulkan gangguan pencernaan mual dan kram perut", "menghasilkan senyawa yang menghambat sinyal saraf dan kontraksi otot sehingga penglihatan terganggu dan otot melemah", "menyerap komponen ikan ke dalam dinding sel bakteri untuk bertahan hidup sehingga menyebabkan gangguan pencernaan dan saraf optik", "mengubah gula dan asam amino dalam ikan menjadi senyawa alkohol yang memengaruhi koordinasi dan saraf penglihatan", "menghasilkan gas pada kondisi anaerob yang meningkatkan tekanan di dalam kemasan ikan sehingga memengaruhi kualitas fisik produk"]}, {"n": 3, "type": "PG", "el": "Keanekaragaman Hayati", "stem": ["Lintah merupakan hewan yang sering ditemukan di daerah lembap seperti hutan hujan tropis. Hewan ini sangat bergantung pada makhluk hidup lain agar dapat bertahan hidup. Lintah juga diketahui cukup berbahaya saat menempel pada tubuh hewan lain, seperti rusa, kerbau liar, bahkan manusia."], "stem2": [], "ask": ["Dalam interaksinya dengan makhluk hidup lain, lintah akan ...."], "ans": 1, "ex": ["Lintah menempel pada inang dan mengisap darahnya sebagai sumber nutrisi. Lintah diuntungkan sedangkan inang dirugikan, sehingga interaksinya adalah **parasitisme** (ektoparasit)."], "opts": ["berkompetisi dengan inang untuk mendapatkan makanan", "memanfaatkan tubuh inangnya sebagai sumber nutrisi", "melekatkan diri pada makhluk hidup lain untuk membersihkan darahnya", "menempel pada inang untuk mendapatkan perlindungan dari predator", "hidup bebas berdampingan dengan makhluk hidup lain di hutan"]}, {"n": 4, "type": "PG", "el": "Sel", "stem": ["Skema berikut menunjukkan siklus respirasi seluler."], "stem2": [], "ask": ["Dengan mencermati skema respirasi seluler tersebut, manakah dari proses berikut yang terjadi pada tahap berlabel A?"], "ans": 4, "ex": ["Tahap A mencakup glukosa → asam piruvat, yaitu **glikolisis** di sitoplasma. Pada tahap awal glikolisis, gugus fosfat ditambahkan ke molekul gula (glukosa → glukosa-6-fosfat, dst.) dan ATP dihasilkan melalui fosforilasi tingkat substrat.", "Opsi A dan D adalah proses siklus Krebs (B), opsi C adalah rantai transpor elektron, dan opsi B salah karena glikolisis tidak menambahkan gugus oksigen."], "opts": ["Gugus gula bereaksi dengan oksaloasetat kemudian masuk ke siklus Krebs.", "Proses pengubahan glukosa menjadi asam piruvat dengan penambahan gugus oksigen.", "Pelepasan elektron dari NADH dan FADH₂ untuk menghasilkan ATP.", "Proses oksidasi suksinat menjadi fumarat disertai produksi FADH₂.", "Produksi ATP melalui penambahan gugus fosfat ke molekul gula."], "fig": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUE  murid SMA melakukan percobaan kerja enzim protease dengan menggunakan putih telur sebagai substrat. Putih telur dimasukkan ke dalam 3 (tiga) tabung reaksi dengan label berturut-turut A, B, dan C dengan perlakuan yang berbeda. Ketiga tabung reaksi tersebut selanjutnya ditempatkan ke dalam bak yang berisi air dengan suhu 37ºC selama 30 menit. Perlakuan dan hasil percobaan untuk setiap tabung reaksi adalah sebagai berikut."], "stem2": ["Aktivitas enzim diamati dari kondisi larutan tiap tabung. Semakin bening larutan maka semakin optimal kerja enzim protease."], "ask": ["Berdasarkan hasil percobaan ini, faktor utama yang memengaruhi kerja enzim protease adalah ...."], "ans": 1, "ex": ["Ketiga tabung memiliki suhu (37ºC), waktu (30 menit), substrat, dan volume yang sama. Perbedaannya hanya zat yang ditambahkan: tanpa tambahan (agak keruh), HCl/asam (bening), dan NaOH/basa (keruh). Karena yang berubah adalah tingkat keasaman/kebasaan, faktor utama yang memengaruhi kerja protease adalah **pH**. Larutan paling bening (tabung B) menunjukkan protease paling optimal pada kondisi asam."], "opts": ["konsentrasi enzim protease dalam tabung reaksi", "pH lingkungan tempat enzim protease bekerja", "jenis substrat yang digunakan dalam percobaan", "suhu larutan selama percobaan berlangsung", "waktu inkubasi enzim protease dengan substrat"], "table": {"widths": [1200, 5000, 2000], "header": ["Tabung", "Perlakuan", "Kondisi Larutan"], "rows": [["A", "2 ml putih telur + 1 ml protease", "Agak keruh"], ["B", "2 ml putih telur + 1 ml protease + 1 ml HCl", "Bening"], ["C", "2 ml putih telur + 1 ml protease + 1 ml NaOH", "Keruh"]], "center": [0, 2]}}, {"n": 6, "type": "PG", "el": "Sel", "stem": ["Seorang murid ingin menyelidiki proses fotosintesis pada tumbuhan. Ia memilih daun tanaman kembang sepatu (*Hibiscus rosa-sinensis*) yang masih menempel di batang dan menutup sebagian permukaannya dengan *aluminium foil*. Daun tersebut dibiarkan terpapar cahaya matahari selama 6 jam agar proses fotosintesis dapat berlangsung. Setelah itu, daun dipetik, direbus dalam air panas untuk mematikan jaringan dan direndam dalam alkohol panas untuk melarutkan klorofil. Kemudian *foil* dilepas dan daun ditetesi larutan lugol (iodium) untuk menguji keberadaan amilum. Ilustrasi percobaan digambarkan sebagai berikut."], "stem2": ["Hasil pengamatan menunjukkan bahwa bagian daun yang terbuka berubah warna menjadi biru kehitaman (positif amilum), sedangkan bagian yang tertutup tetap berwarna pucat (negatif amilum)."], "ask": ["Berdasarkan percobaan tersebut, faktor yang memengaruhi fotosintesis pada daun tersebut adalah ...."], "ans": 0, "ex": ["Sebagian daun ditutup *aluminium foil* sehingga tidak menerima cahaya. Bagian terbuka positif amilum, bagian tertutup negatif. Karena variabel yang dibedakan hanya paparan cahaya (daun, klorofil, suhu, dan CO₂ sama), faktor yang memengaruhi fotosintesis adalah **intensitas/ketersediaan cahaya**."], "opts": ["intensitas cahaya pada permukaan daun", "konsentrasi karbon dioksida di udara", "lebar dan tipisnya permukaan daun", "ketersediaan klorofil pada daun", "suhu optimal untuk kerja enzim fotosintesis"], "fig": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEaAvgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oA  ["Seorang pengemudi truk berusia 45 tahun mengalami kecelakaan lalu lintas setelah kendaraan yang dikemudikannya tiba-tiba keluar jalur. Berdasarkan keterangan saksi, pengemudi terlihat mengantuk dan sempat memejamkan mata beberapa detik sebelum tabrakan terjadi. Riwayat medis dan hasil keterangan yang diperoleh menunjukkan ia sering terbangun di malam hari dengan napas terengah-engah dan mendengkur keras. Pemeriksaan medis mengungkapkan adanya gangguan *obstructive sleep apnea* (OSA), di mana saluran napas atas tersumbat berulang kali saat tidur. Hasil rekam jantung (EKG) menunjukkan adanya pola detak jantung yang tidak teratur."], "stem2": [], "ask": ["Berdasarkan informasi tersebut, hubungan gejala yang dialami pengemudi tersebut dengan komplikasi yang muncul adalah...."], "ans": 0, "ex": ["Pada OSA, saluran napas atas tersumbat berulang saat tidur sehingga kadar oksigen darah turun (hipoksia). Hipoksia membebani jantung dan memicu aritmia (detak tidak teratur). Tidur yang terputus-putus menyebabkan kantuk berlebihan di siang hari dan *microsleep*, sehingga opsi B, C, D, dan E salah."], "opts": ["gangguan napas saat tidur menyebabkan kurangnya oksigen meningkatkan risiko detak jantung tidak teratur", "dengkur keras mengganggu kualitas tidur sehingga mencegah terjadinya penyumbatan saluran napas atas", "*microsleep* terjadi karena saluran napas tetap terbuka sepanjang malam sehingga tubuh kekurangan tidur", "kekurangan oksigen saat tidur membuat pasien lebih jarang mengalami kantuk berlebihan pada siang hari", "aritmia muncul akibat penurunan kadar karbon dioksida yang memicu otot jantung bekerja lebih stabil"]}, {"n": 8, "type": "PG", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Gambar berikut merupakan komponen penyusun jaringan darah manusia."], "stem2": [], "ask": ["Dengan mencermati struktur ketiga komponen darah tersebut, pernyataan berikut yang menunjukkan persamaan komponen berlabel B dan C adalah ...."], "ans": 3, "ex": ["Komponen A adalah eritrosit, B adalah leukosit, dan C adalah trombosit. Persamaan B dan C: keduanya berbentuk tidak beraturan (eritrosit bulat pipih bikonkaf) dan dibentuk di sumsum tulang merah.", "Opsi A salah karena trombosit tidak berinti. Opsi B dan E adalah ciri eritrosit. Opsi C salah karena leukosit berinti dan hormon diangkut plasma."], "opts": ["memiliki inti sel dan berperan dalam pertahanan tubuh terhadap patogen", "tidak berinti dan berperan dalam pengangkutan oksigen ke jaringan tubuh", "tidak memiliki inti sel dan berfungsi membawa hormon ke seluruh tubuh", "berbentuk tidak beraturan dan diproduksi di sumsum tulang", "bentuk bulat pipih dan berfungsi dalam pengangkutan karbon dioksida"], "fig": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAIHAvgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6pooooAKKKKAAnFJupGNR+cqjLkL9TRZiuibIozVN9RhTo276VC+qgdEP4nFNRYOSRolqN1Y76wQMsYwe3zVVk8QlTgy24+pp8rJ9pE6LdRweSa5k+JdvW4hH0IoHiZT/AMvEX5inyMOc6UnAwDS7uK5geIW6m5i+mRUo8RZ+68J+rUezYvaI6LdS5rBj8Qkn5hH+BqVdeXq0efoaORj9ojY3UoOay49bt5PvZQ+9WY7+CThJUJ9zScWCmmW80gOaYJARxg+4pympLHUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFJmkzQA6ik3A0A5oAWiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigDP1XXNO0KD7Tql9a2UGceZPIEBPpz1rC/4Wv4HH/M0aZ/39rgvidoNp4  (Benar):** tanpa trombokinase, protrombin tidak aktif menjadi trombin sehingga pembekuan lambat.", "**S3 (Salah):** berkurangnya trombokinase justru memperlambat, bukan mempercepat, pembekuan."], "rows": ["Darah terus mengalir karena vitamin K tidak dapat diubah menjadi benang fibrin.", "Luka lambat menutup karena trombokinase tidak dapat mengaktifkan protrombin menjadi trombin.", "Mempercepat pembekuan darah karena mengurangi aktivitas fibrinogen dalam mengalirkan darah."], "cat": ["Pernyataan", "Benar", "Salah"]}, {"n": 10, "type": "KAT", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Seorang pria berusia 35 tahun sering mengalami sakit kepala, kaku pada tengkuk leher, nyeri dada, dan sesak napas. Dokter menyarankan agar ia menjaga dan menurunkan kadar kolesterolnya. Hasil pemeriksaan laboratorium menunjukkan:"], "stem2": [], "ask": ["Berkaitan dengan keluhan yang dialami, manakah aktivitas atau kebiasaan yang sering dilakukan oleh pria tersebut selama beberapa tahun terakhir? Klik pilihan **Sesuai** atau **Tidak Sesuai** pada setiap pernyataan berikut yang mempengaruhi kesehatan pria tersebut!"], "ans": [0, 1, 0], "ex": ["Data: LDL tinggi (195 mg/dL), tekanan darah dan denyut jantung di atas normal; HDL normal.", "**S1 (Sesuai):** lemak jenuh dan makanan cepat saji meningkatkan LDL.", "**S2 (Tidak Sesuai):** yoga dan meditasi bukan penyebab LDL tinggi; hubungan sebab-akibat pada pernyataan keliru (yoga justru membantu kesehatan jantung, hanya saja jarang dilakukan).", "**S3 (Sesuai):** stres kronis dan kurang tidur meningkatkan hormon stres sehingga tekanan darah dan denyut jantung naik."], "rows": ["Sering mengonsumsi makanan tinggi lemak jenuh dan cepat saji sehingga kadar LDL meningkat.", "Terkadang mengikuti kelas yoga dan meditasi beberapa kali sebulan untuk kesehatan jantung, sehingga LDL tetap tinggi.", "Sering mengalami stres kerja dan kurang tidur kronis, yang dapat memengaruhi tekanan darah dan denyut jantung."], "cat": ["Pernyataan", "Sesuai", "Tidak Sesuai"], "table": {"widths": [4000, 1200, 2000], "header": ["Jenis Pemeriksaan", "Hasil", "Nilai Normal"], "rows": [["Tekanan Darah", "190/120", "120/80 mmHg"], ["Denyut Jantung", "98", "60-80 kali/menit"], ["Kadar kolestrol LDL (*low-density lipoproteins*)", "195", "<100 mg/dL"], ["Kadar kolestrol HDL (*high-density lipoproteins*)", "65", "≥60 mg/dL"]], "center": [1, 2]}}, {"n": 11, "type": "PG", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Pak Junaidi (40 tahun), seorang kuli bangunan, bekerja tiada henti pada kondisi panas terik. Karena terlalu fokus bekerja, Pak Junaidi kurang minum. Tiba-tiba Pak Junaidi pingsan. Saat diperiksa, diketahui bahwa suhu tubuh Pak Junaidi sangat tinggi (40,5°C), kulit memerah, tidak berkeringat, dan denyut nadi cepat. Pak Junaidi dinyatakan mengalami serangan panas (*heat stroke).*"], "stem2": [], "ask": ["Apa penyebab utama kegagalan tubuh Pak Junaidi dalam mempertahankan suhu normalnya?"], "ans": 0, "ex": ["Pada lingkungan panas tubuh melepas panas melalui berkeringat (penguapan). Karena Pak Junaidi kurang minum (dehidrasi), produksi keringat terhenti sehingga panas tidak dapat dibuang dan suhu tubuh naik hingga terjadi *heat stroke*. Pelebaran pembuluh darah kulit justru membantu membuang panas, dan tubuh tidak \"berhenti mengatur\" suhu untuk menghemat energi."], "opts": ["Dehidrasi membuat proses berkeringat terhenti, sehingga panas tidak dapat dikeluarkan secara efektif.", "Pelebaran pembuluh darah di kulit menyebabkan tubuh menyimpan panas berlebihan di dalam darah.", "Tingginya suhu tubuh menyebabkan otot bekerja lebih cepat, sehingga suhu tubuh tidak bisa turun.", "Kurangnya cairan menyebabkan meningkatkan aliran darah yang justru menaikkan suhu tubuh.", "Kondisi lingkungan yang panas menyebabkan tubuh berhenti mengatur suhu tubuh untuk menghemat energi."]}, {"n": 12, "type": "KAT", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Seorang pria bernama Pak Gito, berusia 69 tahun, ditemukan di pasar pada suatu pagi. Beliau tersesat dan lupa jalan kembali ke rumah, tidak ingat bagaimana beliau sampai ke pasar pagi itu. Saat ditanya oleh warga setempat, Pak Gito lupa akan namanya dan nama keluarganya. Selain itu, Pak Gito juga sering mengulangi pertanyaan yang sama, “Saya di mana?” meskipun pertanyaan tersebut sudah dijawab oleh warga. Setelah dilakukan pemeriksaan melalui MRI, Pak Gito didiagnosis mengalami gejala penyakit Alzheimer."], "stem2": [], "ask": ["Apa hubungan antara gejala yang dialami Pak Gito dengan gangguan pada mekanisme fisiologis akibat penyakit Alzheimer?", "Tentukan **BENAR** atau **SALAH** pada pernyataan berikut yang sesuai dengan gangguan yang dialami Pak Gito!"], "ans": [0, 1, 0], "ex": ["Alzheimer ditandai plak amiloid dan kekusutan protein tau yang merusak sinaps dan neuron, terutama di hipokampus dan korteks.", "**S1 (Benar):** hipokampus dan lobus parietal berperan dalam memori dan orientasi spasial (tersesat, lupa lokasi).", "**S2 (Salah):** penumpukan protein abnormal terutama di hipokampus/korteks, bukan hipotalamus.", "**S3 (Benar):** plak mengganggu komunikasi antarneuron sehingga fungsi kognitif (memori, bahasa) menurun."], "rows": ["Kerusakan pada area lobus parietal dan hippocampus menyebabkan gangguan pada memori spasial yang berkaitan dengan lokasi dan arah.", "Penumpukan protein abnormal yang terjadi pada area hipotalamus mengakibatkan penurunan ingatan baik nama maupun lokasi.", "Plak yang terbentuk pada sel saraf menghalangi komunikasi antar sel dan mengakibatkan penurunan fungsi kognitif seperti memori dan bahasa."], "cat": ["Pernyataan", "Benar", "Salah"]}, {"n": 13, "type": "PG", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Alika seorang remaja berumur 12 tahun, selama dua bulan terakhir mengalami beberapa gejala antara lain sering buang air kecil, rasa haus yang berlebihan, mudah lapar serta penurunan berat badan secara drastis. Setelah menjalani serangkaian pemeriksaan laboratorium diketahui bahwa kadar gula puasa Alika mencapai 300 mg/dL dan terdapat antibodi anti-GAD (*anti-glutamic acid decarboxylase*) pada sampel darahnya sebagai penanda autoimun. Berdasarkan hasil pemeriksaan tersebut, dokter mendiagnosis Alika menderita diabetes melitus tipe 1. Dokter menjelaskan bahwa gejala diabetes tipe 1 mirip dengan diabetes tipe 2 yang lebih umum terjadi di masyarakat, tetapi penyebabnya berbeda."], "stem2": [], "ask": ["Bagaimana mekanisme autoimun pada diabetes melitus yang diderita Alika dapat menyebabkan peningkatan kadar gula dalam darah (hiperglikemia)?"], "ans": 3, "ex": ["Diabetes tipe 1 adalah penyakit autoimun: sel T sitotoksik menyerang dan merusak sel beta pulau Langerhans pankreas, sehingga insulin tidak dihasilkan dan glukosa tidak masuk ke sel (hiperglikemia). Sel yang diserang adalah sel beta (bukan alfa), dan penyebabnya bukan infeksi bakteri atau kompleks antigen-antibodi terhadap hormon."], "opts": ["Limfosit B menyerang sel alfa pankreas yang berperan sebagai penghasil glukagon.", "Kompleks antigen-antibodi menghambat kerja hormon insulin dan glukagon.", "Infeksi bakteri pada pankreas menghancurkan reseptor insulin dan glukagon.", "Sel T sitotoksik merusak sel beta pankreas yang menghasilkan insulin.", "Antibodi menghambat kerja hormon insulin dalam mengubah glukosa menjadi glikogen."]}, {"n": 14, "type": "PG", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Setiap kali menghadapi ulangan harian, Vito mengalami gejala yang kurang mengenakkan. Jantungnya berdegup sangat kencang, muncul keringat dingin, tangan gemetar, sulit menelan, sering ingin buang air kecil, napas tersengal-sengal, serta tekanan darahnya naik hingga 140/90 mmHg. Gejala-gejala ini biasanya muncul beberapa menit sebelum ujian dimulai dan hilang sekitar 15 menit setelah kertas ulangan dikumpulkan.", "Reaksi tubuh seperti ini merupakan bagian dari respons “lawan atau lari” yang dipicu oleh sistem saraf simpatis. Dalam kondisi cemas, kelenjar adrenal melepaskan hormon adrenalin ke aliran darah, sehingga memengaruhi kerja berbagai organ tubuh."], "stem2": [], "ask": ["Manakah mekanisme kerja hormon adrenalin yang paling tepat sesuai dengan gejala yang dialami Vito?"], "ans": 0, "ex": ["Adrenalin dari kelenjar adrenal pada respons \"lawan atau lari\" menyempitkan (vasokonstriksi) pembuluh darah di organ tertentu sehingga tekanan darah naik, dan jantung berdetak lebih cepat dan kuat. Opsi B salah karena adrenalin melebarkan bronkiolus, opsi C salah karena curah jantung bertambah, opsi D salah karena kandung kemih berelaksasi, dan opsi E salah karena pencernaan melambat akibat relaksasi otot polos."], "opts": ["Otot polos pembuluh darah menyempit sehingga aliran darah ke organ tertentu meningkat dan tekanan darah bertambah cepat.", "Saluran udara di paru-paru menyempit lalu memicu napas menjadi lebih cepat untuk mencukupi kebutuhan oksigen tubuh.", "Detak jantung menjadi lebih kuat sehingga jumlah darah yang keluar dari jantung berkurang dan otot tubuh bergetar.", "Kandung kemih menjadi lebih peka terhadap rangsang, disertai aliran darah ke ginjal yang meningkat sehingga timbul rasa ingin buang air kecil.", "Gerakan otot saluran pencernaan di tenggorokan melambat karena otot polosnya berkontraksi dan menghambat proses menelan."]}, {"n": 15, "type": "MCMA", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Dini, seorang perempuan berusia 25 tahun, dan suaminya Dono yang berusia 28 tahun telah menikah selama satu tahun, namun belum dikaruniai keturunan. Hasil observasi menunjukkan bahwa Dini mengalami siklus haid yang tidak teratur (sekitar 2 hingga 4 bulan sekali), wajahnya banyak jerawat, dan berat badannya meningkat. Pemeriksaan ultrasonografi (USG) memperlihatkan adanya kista pada ovarium kiri Dini. Berdasarkan pemeriksaan tersebut, dokter mendiagnosis Dini mengalami PCOS (*Polycystic Ovary Syndrome* / Sindrom Ovarium Polikistik)."], "stem2": [], "ask": ["Berdasarkan gejala yang dialami Dini, solusi mana saja yang tepat agar Dini dapat mengalami kehamilan?", "Klik pada semua jawaban yang benar! Jawaban benar lebih dari satu."], "ans": [2, 3, 4], "ex": ["PCOS menyebabkan gangguan hormon dan ovulasi tidak teratur sehingga kesuburan menurun.", "**A (salah):** peningkatan prolaktin justru menghambat ovulasi.", "**B (salah):** kista tidak berarti ovarium harus diangkat; ovarium masih dapat berfungsi.", "**C (benar):** pola makan sehat dan olahraga menurunkan berat badan dan menyeimbangkan hormon.", "**D (benar):** suntikan FSH/LH di bawah pengawasan dokter merangsang ovulasi.", "**E (benar):** bayi tabung (IVF) menjadi opsi lanjutan bila stimulasi ovulasi belum berhasil, dengan sperma suami."], "opts": ["Mengonsumsi suplemen peningkat hormon prolaktin secara rutin agar siklus haid teratur.", "Operasi pengangkatan ovarium karena ovarium yang terkena kista tidak akan berfungsi lagi.", "Menerapkan pola makan sehat dan rutin berolahraga agar hormon menjadi seimbang.", "Mendapatkan suntikan hormon FSH/LH dibawah observasi dokter untuk merangsang ovulasi.", "Mengikuti program bayi tabung dengan sperma Dono agar peluang mendapat keturunan lebih besar."]}, {"n": 16, "type": "PG", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Bu Mita sedang hamil 6 bulan. Beberapa minggu terakhir, Bu Mita sering merasa lemas dan pusing. Bu Mita juga merasakan bahwa gerakan bayi di kandungannya menjadi lemah atau jarang bergerak. Bu Mita segera memeriksakan diri ke dokter kandungan. Dari pemeriksaan tersebut diketahui bahwa kadar hemoglobin dalam darahnya rendah yaitu 7 g/dL (normalnya > 11 g/dL). Ternyata Bu Mita selama ini tidak suka makan daging dan sayuran hijau."], "stem2": [], "ask": ["Berdasarkan gejala dan hasil pemeriksaan tersebut, bagaimana kondisi Bu Mita dapat memengaruhi janinnya?"], "ans": 1, "ex": ["Hemoglobin yang rendah (anemia, 7 g/dL) menurunkan pengangkutan oksigen dari ibu ke janin, sehingga perkembangan otak dan organ janin kurang optimal dan gerakan janin melemah. Opsi A, C, dan E tidak sesuai fungsi hemoglobin. Opsi D menyangkut ibu, bukan janin, dan pembekuan darah bukan fungsi hemoglobin."], "opts": ["Rendahnya hemoglobin menyebabkan darah ibu mengalir cepat melalui plasenta sehingga janin kelebihan berat badan.", "Janin kekurangan oksigen yang dibawa hemoglobin sehingga perkembangan otak dan organ kurang optimal.", "Hemoglobin rendah menyebabkan darah ibu pekat sehingga janin tidak tumbuh karena kurang asupan nutrisi.", "Resiko pendarahan pada ibu ketika persalinan karena hemoglobin membantu proses pembekuan darah.", "Janin rentan mengalami infeksi karena hemoglobin berfungsi menyerang bakteri dan virus dalam rahim."]}, {"n": 17, "type": "KAT", "el": "Keterampilan Proses", "stem": ["Perhatikan ilustrasi percobaan berikut ini!"], "stem2": ["Ilustrasi menggambarkan hasil percobaan seorang murid. Dia meneteskan larutan lugol ke dalam nasi, tahu dan pisang yang telah dihaluskan."], "ask": ["Pertanyaan apa yang ingin dijawab oleh murid melalui percobaan?", "Tentukan **Benar** atau **Salah** untuk setiap pertanyaan berikut yang dapat dikembangkan berdasarkan ilustrasi hasil percobaan murid!"], "ans": [0, 0, 1], "ex": ["Lugol menguji amilum (biru kehitaman = positif; ungu = amilum sedikit).", "**S1 (Benar):** pertanyaan relevan, nasi kaya amilum dan menghasilkan warna biru kehitaman.", "**S2 (Benar):** pisang menunjukkan warna ungu; pertanyaan tentang kandungan amilum pisang matang dapat dikembangkan dari hasil.", "**S3 (Salah):** lugol tidak menguji protein, dan warna ungu pada gambar adalah pada pisang, bukan tahu."], "rows": ["Mengapa nasi menunjukkan warna biru kehitaman setelah ditetesi lugol?", "Bagaimana kandungan amilum pada pisang matang memengaruhi hasil uji?", "Apakah warna ungu menunjukkan bahwa tahu mengandung protein tinggi?"], "cat": ["Pertanyaan", "Benar", "Salah"], "fig": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQ arus dilakukan murid dalam proses pengumpulan data adalah...."], "ans": 1, "ex": ["Langkah awal pengumpulan data adalah menetapkan lokasi pengamatan yang konsisten dan mencatat variabel yang diselidiki (suhu) secara berkala di tiap lokasi. Mengukur tinggi tanaman hanya di satu area, menyimpulkan lebih dulu, atau memindahkan tanaman ke pot mengubah desain atau mendahului pengumpulan data."], "opts": ["mengukur tinggi tanaman liar setiap hari di area yang paling banyak terkena sinar matahari", "menentukan lokasi pengamatan yang konsisten dan mencatat suhu di tiap lokasi secara berkala", "membersihkan area dari gulma lain sebelum memulai pengamatan agar hasilnya tidak terganggu", "menyimpulkan bahwa cahaya matahari adalah faktor utama yang memengaruhi pertumbuhan", "memindahkan beberapa tanaman liar ke pot agar bisa diamati di lokasi yang lebih terkontrol"]}, {"n": 20, "type": "PG", "el": "Keterampilan Proses", "stem": ["Sekelompok murid melakukan percobaan mengenai efektivitas daya hambat ekstrak bawang putih (*Allium sativum*) terhadap pertumbuhan bakteri penyebab jerawat. Percobaan dilakukan dengan cara merendam cakram kertas pada ekstrak bawang putih dan diletakkan pada cawan berisi agar. Kertas ini memiliki sifat inert (tidak bereaksi dengan zat uji) dan mudah menyerap cairan ekstrak/antibiotik sehingga bisa melepaskan zat tersebut perlahan ke medium agar. Terdapat 4 (empat) perlakuan dan 2 (dua) kontrol yang digunakan dalam percobaan. Variabel terikat yang diukur adalah diameter zona bening (mm) yang dihasilkan setelah inkubasi selama 24 jam. Murid menetapkan hipotesis “Semakin tinggi konsentrasi ekstrak bawang putih, semakin lebar diameter zona bening”.", "Dari percobaan tersebut diperoleh hasil sebagai berikut:"], "stem2": [], "ask": ["Berdasarkan hasil percobaan tersebut, guru menyampaikan bahwa data yang diperoleh kurang dapat mendukung hipotesis. Mengapa demikian?"], "ans": 2, "ex": ["Hasil ulangan pada perlakuan yang sama tidak konsisten: B (2,1; 5,5; 2,6) dan D (7,5; 1,5; 7,7) memiliki satu nilai yang menyimpang jauh dari dua lainnya, sehingga tren konsentrasi vs. zona bening tidak jelas. Data pada A bahkan bervariasi dari 1,3 sampai 3,2. Jadi data kurang dapat mendukung hipotesis karena terdapat data yang tidak konsisten."], "opts": ["Ulangan yang dilakukan pada terlalu banyak.", "Konsentrasi ekstrak bawang putih kurang bervariasi.", "Terdapat data yang tidak konsisten pada perlakuan.", "Rentang konsentrasi ekstrak terlalu besar.", "Data kontrol positif dan negatif terlalu ekstrim."], "table": {"widths": [4400, 1500, 1500, 1500], "header": ["Perlakuan", "Zona Bening 1 (mm)", "Zona Bening 2 (mm)", "Zona Bening 3 (mm)"], "rows": [["Kontrol negatif : Air steril", "0", "0", "0"], ["A (cakram+ ekstrak bawang putih 25%)", "1,3", "1,5", "3,2"], ["B (cakram+ ekstrak bawang putih 50%)", "2,1", "5,5", "2,6"], ["C (cakram+ ekstrak bawang putih 75%)", "3,2", "3,8", "3,5"], ["D (cakram+ ekstrak bawang putih 100%)", "7,5", "1,5", "7,7"], ["Kontrol positif: Amoxicillin", "25", "24", "26"]], "center": [1, 2, 3]}}, {"n": 21, "type": "PG", "el": "Keterampilan Proses", "stem": ["Seorang murid melakukan eksperimen untuk menguji hipotesisnya bahwa “Tanaman kacang hijau akan tumbuh lebih cepat jika ditanam pada media tanah dibandingkan media pasir atau tanah liat.”", "Ia menanam biji kacang hijau dalam pot berisi media tanam berbeda (pasir, tanah, dan tanah liat) dan menyiramnya dengan volume air yang sama setiap hari. Pengamatan tinggi tanaman dilakukan selama 4 hari.", "Berikut adalah hasil eksperimennya."], "stem2": [], "ask": ["Berdasarkan hasil percobaan tersebut, pernyataan yang paling tepat untuk menghubungkan hasil analisis data dengan hipotesis awal adalah ...."], "ans": 0, "ex": ["Hipotesis: pertumbuhan lebih cepat pada media tanah. Pada hari ke-4 tinggi tanaman di tanah 3,7 cm, lebih tinggi daripada pasir (2 cm) dan tanah liat (mati), dan tertinggi setiap harinya. Data sesuai dan mendukung hipotesis. Opsi lain menolak, menyatakan tidak terbukti, atau meminta data tambahan padahal hipotesis dapat dinilai dari data yang ada."], "opts": ["data mendukung karena pertumbuhan tanaman tercepat dan tertinggi terjadi pada media tanah dibandingkan dua media lainnya", "sebaiknya ditolak karena tanaman tetap tumbuh pada semua media, termasuk pasir dan tanah liat", "tidak terbukti karena tanaman pada media tanah liat mengalami kematian sebelum hari keempat", "belum dapat disimpulkan secara pasti karena data lingkungan dan pengulangan percobaan tidak tersedia untuk memastikan validitas hasil", "memerlukan revisi karena meskipun pertumbuhan di media tanah paling tinggi, perbedaan pertumbuhan di antara media tidak terlalu besar"], "table": {"widths": [2000, 2000, 2000, 2000], "header": ["Waktu (hari)", "Tinggi tanaman pada media pasir (cm)", "Tinggi tanaman pada media tanah (cm)", "Tinggi tanaman pada media tanah liat (cm)"], "rows": [["1", "0", "0", "0"], ["2", "1", "1,5", "0,5"], ["3", "1,5", "2,6", "0,8"], ["4", "2", "3,7", "Mati"]], "center": [0, 1, 2, 3]}}, {"n": 22, "type": "PG", "el": "Keanekaragaman Hayati", "stem": ["Suatu wilayah dataran tinggi mengalami peningkatan signifikan dalam konsentrasi karbon dioksida (CO₂) di udara. Data dari stasiun pemantauan lingkungan menunjukkan bahwa konsentrasi CO₂ meningkat dari 410 ppm menjadi 480 ppm. Sebagian besar akibat pembukaan lahan dengan cara pembakaran dan aktivitas industri pengolahan mineral. Wilayah ini didominasi oleh hutan pinus dan semak endemik yang memiliki laju fotosintesis tinggi dan pertumbuhan musiman yang sangat dipengaruhi oleh faktor abiotik. Selama kurun waktu yang sama para peneliti mencatat bahwa kepadatan daun pada pohon pinus meningkat. Namun juga terjadi perubahan komposisi spesies semak karena tidak semua spesies dapat beradaptasi terhadap perubahan tersebut."], "stem2": [], "ask": ["Berdasarkan informasi tersebut, dampak yang paling mungkin terjadi akibat peningkatan CO₂ terhadap tumbuhan di wilayah tersebut adalah ...."], "ans": 2, "ex": ["Peningkatan CO₂ meningkatkan bahan baku fotosintesis, sehingga produksi biomassa naik pada tumbuhan yang toleran (kepadatan daun pinus meningkat), sedangkan sebagian spesies semak tidak beradaptasi sehingga komposisi berubah. Opsi A, B, D tidak didukung data, dan opsi E bertentangan dengan wacana (komposisi semak berubah)."], "opts": ["terhambatnya proses fotosintesis karena CO₂ dalam konsentrasi tinggi mengganggu aktivitas stomata", "penurunan jumlah daun akibat peningkatan transpirasi dan suhu lingkungan yang ekstrem", "meningkatnya produksi biomassa pada jenis tumbuhan tertentu yang toleran terhadap peningkatan CO₂", "penurunan kadar klorofil karena CO₂ yang berlebihan menyebabkan stres fisiologis", "tidak terjadi perubahan karena semua jenis tumbuhan memiliki plastisitas fisiologis yang sama terhadap lingkungan"]}, {"n": 23, "type": "PG", "el": "Keanekaragaman Hayati", "stem": ["Tanaman *Lantana camara* yang berasal dari Amerika Tengah diperkenalkan ke beberapa daerah di Indonesia Timur sebagai tanaman hias dan penutup lahan karena kemampuannya bertahan di tanah kering. Namun tanaman ini menunjukkan pertumbuhan yang sangat agresif. Data dari Balai Konservasi Sumber Daya Alam menyebutkan bahwa pada tahun 2022 *Lantana camara* telah mendominasi lebih dari 35% padang savana di Taman Nasional Wasur, Papua. Menggantikan rumput asli seperti *Imperata cylindrica* yang sebelumnya menopang populasi burung cenderawasih, kupu-kupu endemik *Ornithoptera priamus*, dan berbagai reptil kecil.", "Selain itu pengamatan lapangan menunjukkan bahwa jumlah spesies serangga penyerbuk menurun hingga 40% dalam waktu kurang dari lima tahun sejak dominasi *Lantana*. Para ahli ekologi mengkhawatirkan bahwa perubahan vegetasi ini akan berdampak jangka panjang terhadap struktur komunitas dan siklus ekologis di kawasan tersebut."], "stem2": [], "ask": ["Berdasarkan informasi tersebut, dampak ekologis utama dari invasi tanaman tersebut terhadap keanekaragaman hayati lokal adalah ...."], "ans": 0, "ex": ["*Lantana camara* adalah spesies invasif yang mendominasi >35% savana, menggantikan rumput asli dan menurunkan serangga penyerbuk (40%), burung, dan kupu-kupu. Dominasi ruang dan senyawa alelopatik menurunkan keanekaragaman flora dan fauna. Opsi lain tidak sesuai data."], "opts": ["menggantikan tanaman endemik melalui dominasi ruang dan senyawa alelopatik, sehingga menurunkan keberagaman flora dan fauna", "meningkatkan kesuburan tanah dan memicu regenerasi tanaman lokal karena adaptasi *Lantana* terhadap lingkungan marginal", "tidak berdampak signifikan karena *Lantana* hanya menyebar di lahan kritis dan tidak mengganggu komunitas alami", "meningkatkan jumlah vegetasi hutan sekunder dan menyediakan tempat bersarang baru bagi burung dan reptil kecil", "memfasilitasi interaksi simbiotik antara tanaman lokal dan *Lantana*, sehingga memperkaya komposisi tumbuhan di habitat tersebut"]}, {"n": 24, "type": "PG", "el": "Sel", "stem": ["Seorang pekerja tambang mengalami gejala lemah otot, kelelahan ekstrem, dan penurunan kesadaran setelah terpapar senyawa arsenik dari air tanah di daerah pertambangan. Pemeriksaan toksikologi menunjukkan akumulasi arsenik anorganik dalam darahnya. Senyawa ini diketahui menghambat enzim piruvat dehidrogenase, enzim kunci dalam konversi piruvat menjadi asetil-KoA sebelum masuk ke siklus Krebs."], "stem2": [], "ask": ["Dampak langsung dari gangguan ini terhadap metabolisme sel adalah ...."], "ans": 2, "ex": ["Piruvat dehidrogenase mengubah piruvat menjadi asetil-KoA. Jika dihambat arsenik, asetil-KoA tidak terbentuk sehingga siklus Krebs dan rantai transpor elektron kekurangan substrat, dan ATP menurun. Itulah sebabnya pekerja merasa lemah dan lelah. Opsi A salah karena asetil-KoA tidak terbentuk (bukan menumpuk)."], "opts": ["akumulasi asetil-KoA karena tidak dapat masuk ke siklus Kreb", "penurunan NAD⁺ akibat meningkatnya aktivitas rantai transpor elektron", "penurunan pembentukan ATP karena terganggunya produksi asetil-KoA", "produksi asam laktat meningkat akibat percepatan siklus Krebs", "peningkatan fosforilasi oksidatif karena piruvat menumpuk dalam sitoplasma"]}, {"n": 28, "type": "PG", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Seorang murid kesulitan tidur meskipun tubuhnya sudah terasa lelah. Ia sering menggunakan ponsel hingga larut malam untuk mengerjakan tugas dan menonton video. Akibatnya ia merasa mengantuk saat pelajaran pagi dan sulit fokus di kelas."], "stem2": [], "ask": ["Hormon yang produksinya kemungkinan terganggu karena kebiasaan tersebut adalah ...."], "ans": 2, "ex": ["Cahaya biru dari layar ponsel di malam hari menekan sekresi **melatonin** oleh kelenjar pineal, hormon pengatur siklus tidur-bangun, sehingga sulit tidur dan mengantuk di pagi hari."], "opts": ["adrenalin", "kortisol", "melatonin", "oksitosin", "tiroksin"]}, {"n": 29, "type": "PG", "el": "Proses-Proses Pada Makhluk Hidup", "stem": ["Perhatikan gambar struktur sel neuron berikut!"], "stem2": [], "ask": ["Dalam proses penghantaran impuls saraf, setiap bagian neuron memiliki perannya masing-masing. Salah satu bagian penting yang terdapat di tengah badan sel ditandai dengan bentuk bulat berada di tengah badan sel. Bagian tersebut berperan dalam...."], "ans": 1, "ex": ["Bagian bulat di tengah badan sel adalah **nukleus (inti sel)**, yang mengatur seluruh aktivitas sel termasuk sintesis protein. Opsi A adalah sel Schwann/selubung mielin, C adalah terminal akson, D adalah dendrit, dan E adalah terminal akson dan sinapsis."], "opts": ["menyusun lapisan pelindung akson untuk mempercepat impuls", "mengatur seluruh aktivitas sel saraf termasuk sintesis protein", "menghantarkan impuls saraf ke otot dan kelenjar", "menerima rangsangan dari lingkungan eksternal", "membentuk celah sinapsis sebagai penghubung antar neuron"], "fig": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQ const DATA2=[
mk(1,'PG','Keanekaragaman Hayati',['Harimau Sumatra (*Panthera tigris sumatrae*) dan Harimau Benggala (*Panthera tigris tigris*) memiliki ciri morfologi yang berbeda dan hidup di wilayah geografis yang berbeda, tetapi masih dapat kawin dan menghasilkan keturunan fertil.'],['Berdasarkan tata nama tersebut, hubungan kekerabatan kedua harimau adalah ....'],['berbeda genus tetapi satu famili','satu spesies yang sama tetapi berbeda subspesies','berbeda spesies tetapi satu genus','berbeda famili tetapi satu ordo','berbeda kelas tetapi satu filum'],1,['Nama kedua harimau sama pada genus (*Panthera*) dan epitet spesies (*tigris*), dan hanya berbeda pada nama ketiga. Itu menunjukkan keduanya satu spesies dengan subspesies berbeda. Kemampuan kawin dan menghasilkan keturunan fertil juga menegaskan keduanya satu spesies.']),
mk(2,'MCMA','Keanekaragaman Hayati',['Sebagian hutan mangrove di pesisir suatu daerah dialihfungsikan menjadi tambak udang. Para peneliti mencatat perubahan kondisi lingkungan di kawasan tersebut.'],['Dampak yang paling mungkin terjadi akibat rusaknya hutan mangrove tersebut adalah ....','Klik pada semua jawaban yang benar! Jawaban benar lebih dari satu.'],['Abrasi pantai meningkat karena akar mangrove tidak lagi menahan gelombang.','Tempat pemijahan dan asuhan ikan serta udang alami berkurang.','Produktivitas fotosintesis di perairan pesisir meningkat tajam.','Kemampuan wilayah tersebut menyerap dan menyimpan karbon menurun.','Salinitas tanah menjadi lebih rendah dan stabil.'],[0,1,3],['Akar mangrove menahan gelombang dan sedimen (A benar), menjadi tempat berkembang biak biota laut (B benar), dan menyimpan karbon dalam biomassa dan sedimen (D benar). Hilangnya vegetasi tidak meningkatkan fotosintesis (C salah) dan tidak membuat salinitas stabil (E salah).']),
mk(3,'PG','Keanekaragaman Hayati',['Petani menanam kacang tanah dan menemukan bintil-bintil pada akarnya. Bintil tersebut dihuni bakteri *Rhizobium* yang hidup bersimbiosis dengan tanaman.'],['Peran bakteri *Rhizobium* yang menguntungkan tanaman adalah ....'],['menguraikan selulosa pada akar menjadi glukosa','mengubah nitrogen bebas menjadi senyawa nitrogen yang dapat diserap tanaman','mengubah nitrat tanah menjadi gas nitrogen yang dilepas ke udara','menghasilkan antibiotik yang membunuh jamur tanah','mengubah amonia menjadi nitrit di dalam tanah'],1,['*Rhizobium* melakukan fiksasi nitrogen (N₂ menjadi amonia/senyawa nitrogen) di bintil akar kacang-kacangan sehingga tanaman mendapat nitrogen. Sebagai imbalan, bakteri memperoleh makanan dari tanaman (mutualisme). Opsi C adalah denitrifikasi dan opsi E adalah nitrifikasi.']),
mk(4,'PG','Sel',['Ibu membuat roti dengan menambahkan ragi (*Saccharomyces cerevisiae*) pada adonan, lalu mendiamkannya di tempat hangat selama satu jam. Adonan tampak mengembang dan berongga.'],['Penyebab adonan mengembang adalah ....'],['gas CO₂ hasil fermentasi alkohol terperangkap dalam adonan','asam laktat hasil fermentasi membentuk gelembung dalam adonan','gas O₂ dilepaskan ragi saat respirasi aerob','uap air hasil respirasi aerob mengisi pori adonan','ATP yang dilepaskan menambah volume adonan'],0,['Dalam adonan yang padat, ragi cenderung melakukan fermentasi alkohol: glukosa menjadi etanol dan CO₂. Gas CO₂ terperangkap dalam jaringan gluten sehingga adonan mengembang. Asam laktat adalah hasil fermentasi laktat (bukan oleh ragi), dan ATP tidak menambah volume.']),
mk(5,'PG','Sel',['Sekelompok murid menguji kerja enzim amilase dalam air liur terhadap larutan pati. Larutan pati + amilase diberi iodium; warna biru kehitaman akan hilang jika pati telah terurai. Waktu hilangnya warna biru pada berbagai suhu dicatat berikut.'],['Berdasarkan data tersebut, kesimpulan yang tepat adalah ....'],['kecepatan kerja amilase meningkat terus seiring kenaikan suhu','amilase bekerja paling cepat pada suhu sekitar 37°C dan menurun pada suhu tinggi','amilase tidak dipengaruhi suhu karena substratnya sama','amilase terdenaturasi pada suhu 20°C','pada suhu 80°C pati dipecah paling cepat'],1,['Warna biru paling cepat hilang pada 37°C (4 menit) sehingga aktivitas enzim optimum di suhu tersebut. Pada 60°C melambat dan pada 80°C tidak berubah, menunjukkan denaturasi karena suhu tinggi. Suhu rendah (20°C) hanya memperlambat kerja enzim, bukan merusaknya.'],{table:{header:['Suhu (°C)','Waktu hilangnya warna biru (menit)'],rows:[['20','12'],['37','4'],['60','10'],['80','Tidak hilang (>30)']]}}),
mk(6,'KAT','Proses Makhluk Hidup',['Perhatikan penjelasan tentang alur peredaran darah pada jantung manusia berikut.'],['Tentukan **Benar** atau **Salah** pada pernyataan berikut!'],null,[0,1,0],['**S1 (Benar):** darah kaya oksigen dari paru-paru masuk ke atrium kiri melalui vena pulmonalis.','**S2 (Salah):** katup di antara atrium kanan dan ventrikel kanan adalah katup trikuspid; katup bikuspid (mitral) ada di sisi kiri.','**S3 (Benar):** dinding ventrikel kiri paling tebal karena harus memompa darah ke seluruh tubuh dengan tekanan tinggi.'],{cat:BS,rows:['Darah dari paru-paru masuk ke atrium kiri melalui vena pulmonalis.','Katup bikuspid terletak di antara atrium kanan dan ventrikel kanan.','Dinding ventrikel kiri lebih tebal karena memompa darah ke seluruh tubuh.']}),
mk(7,'PG','Proses Makhluk Hidup',['Seorang anak sering mengalami sesak napas dan bunyi mengi (*wheezing*) setiap kali terpapar debu atau udara dingin. Dokter mendiagnosis anak tersebut menderita asma.'],['Mekanisme yang menyebabkan gejala tersebut adalah ....'],['alveolus kehilangan elastisitas dan pecah sehingga permukaan pertukaran gas berkurang','otot polos bronkiolus berkontraksi dan terjadi peradangan sehingga saluran udara menyempit','diafragma tidak dapat berkontraksi karena gangguan saraf','infeksi bakteri mengisi alveolus dengan cairan','tulang rusuk tidak dapat terangkat saat inspirasi'],1,['Pada asma, alergen atau udara dingin memicu peradangan dan kontraksi otot polos bronkiolus sehingga saluran udara menyempit dan menimbulkan mengi serta sesak. Opsi A menggambarkan emfisema, opsi D pneumonia.']),
mk(8,'PG','Proses Makhluk Hidup',['Pak Anwar sering buang air kecil dan mudah haus. Pemeriksaan menunjukkan kadar glukosa darahnya 350 mg/dL dan urinenya mengandung glukosa, padahal pada orang sehat urine tidak mengandung glukosa.'],['Penyebab ditemukannya glukosa dalam urine Pak Anwar adalah ....'],['glomerulus tidak dapat menyaring glukosa dari darah','kapasitas reabsorpsi tubulus proksimal terlampaui sehingga glukosa tidak seluruhnya diserap kembali','lengkung Henle mensekresikan glukosa ke dalam urine','ADH meningkat sehingga glukosa dikeluarkan bersama air','kandung kemih menghasilkan glukosa dari lemak'],1,['Glukosa disaring di glomerulus dan normalnya direabsorpsi seluruhnya di tubulus proksimal. Saat gula darah sangat tinggi, jumlah glukosa melebihi kapasitas transpor reabsorpsi sehingga sebagian terbuang bersama urine (glukosuria), disertai urine yang banyak karena glukosa menarik air.']),
mk(9,'KAT','Proses Makhluk Hidup',['Seorang murid tidak sengaja menyentuh setrika panas dan spontan menarik tangannya sebelum menyadari rasa panas.'],['Tentukan **Benar** atau **Salah** pada pernyataan berikut mengenai peristiwa tersebut!'],null,[0,1,0],['**S1 (Benar):** pada refleks, sumsum tulang belakang menjadi pusat pengolah sehingga respons cepat.','**S2 (Salah):** urutan yang benar: reseptor, neuron sensorik, sumsum tulang belakang (neuron perantara), neuron motorik, efektor.','**S3 (Benar):** impuls ke otak baru menyusul, sehingga rasa panas disadari setelah tangan ditarik.'],{cat:BS,rows:['Sumsum tulang belakang bertindak sebagai pusat pengolah pada refleks ini.','Impuls berjalan dari reseptor ke neuron motorik, lalu ke neuron sensorik, kemudian ke efektor.','Respons terjadi sebelum otak menyadari rasa panas.']}),
mk(10,'PG','Proses Makhluk Hidup',['Seorang anak berusia 12 tahun bertinggi badan jauh di bawah rata-rata anak seusianya, namun proporsi tubuh dan kecerdasannya normal. Hasil pemeriksaan menunjukkan kelainan pada hormon yang mengatur pertumbuhan.'],['Gangguan yang paling mungkin dialami anak tersebut adalah ....'],['kekurangan tiroksin dari kelenjar tiroid','kelebihan insulin dari pankreas','kekurangan somatotropin dari hipofisis anterior','kelebihan kortisol dari korteks adrenal','kekurangan hormon paratiroid dari kelenjar paratiroid'],2,['Somatotropin (hormon pertumbuhan) dari hipofisis anterior memengaruhi pertumbuhan tulang. Kekurangannya pada masa anak menyebabkan pendek dengan proporsi tubuh normal (dwarfisme hipofisis). Kekurangan tiroksin akan disertai gangguan perkembangan mental dan proporsi tubuh.']),
mk(11,'PG','Proses Makhluk Hidup',['Bayi diberi vaksin campak di puskesmas. Vaksin tersebut mengandung virus campak yang telah dilemahkan.'],['Jenis kekebalan yang terbentuk dan alasannya adalah ....'],['pasif buatan, karena mengandung antibodi siap pakai','aktif buatan, karena antigen yang dilemahkan merangsang pembentukan antibodi dan sel memori','aktif alami, karena tubuh terpapar virus secara alami','pasif alami, karena antibodi berasal dari ibu','nonspesifik, karena melibatkan fagosit saja'],1,['Vaksin memasukkan antigen yang dilemahkan sehingga tubuh sendiri membentuk antibodi dan sel memori (kekebalan aktif buatan, spesifik). Antibodi siap pakai (serum) adalah pasif buatan; antibodi dari ibu adalah pasif alami.']),
mk(12,'MCMA','Proses Makhluk Hidup',['Ibu hamil perlu menjaga kesehatan karena zat-zat dari tubuhnya memengaruhi janin melalui plasenta.'],['Pernyataan manakah yang benar mengenai peran plasenta?','Klik pada semua jawaban yang benar! Jawaban benar lebih dari satu.'],['Memfasilitasi pertukaran oksigen dan nutrisi antara darah ibu dan janin.','Mencampurkan darah ibu dan darah janin secara langsung.','Menghasilkan hormon seperti hCG dan progesteron.','Meneruskan sebagian antibodi (IgG) dari ibu ke janin.','Menyaring seluruh zat berbahaya seperti alkohol dan nikotin.'],[0,2,3],['Plasenta menjadi tempat pertukaran zat melalui difusi tanpa percampuran darah (A benar, B salah), menghasilkan hCG, progesteron, dan estrogen (C benar), serta meneruskan antibodi IgG (D benar). Alkohol dan nikotin dapat melewati plasenta (E salah).']),
mk(13,'PG','Keterampilan Proses',['Seorang murid ingin menyelidiki pengaruh pH tanah terhadap pertumbuhan tanaman cabai. Ia menyiapkan lima pot dengan pH tanah berbeda, masing-masing ditanami bibit cabai.'],['Variabel kontrol yang harus dijaga sama pada percobaan tersebut adalah ....'],['pH tanah','tinggi tanaman','jenis tanaman, volume penyiraman, dan intensitas cahaya','jumlah daun yang tumbuh','warna daun'],2,['Variabel manipulasi adalah pH tanah dan variabel respons adalah pertumbuhan (tinggi, jumlah daun). Variabel kontrol adalah faktor lain yang dibuat sama agar hasil hanya dipengaruhi pH: jenis tanaman, penyiraman, dan cahaya.']),
mk(14,'KAT','Keterampilan Proses',['Seorang murid meneteskan larutan Benedict pada tiga bahan lalu memanaskannya. Hasil: madu berwarna merah bata, susu hijau kekuningan, dan air putih tetap biru.'],['Tentukan **Benar** atau **Salah** untuk setiap pertanyaan berikut yang dapat dikembangkan berdasarkan hasil percobaan!'],null,[0,1,0],['**S1 (Benar):** perbedaan warna menunjukkan kadar gula pereduksi yang berbeda sehingga dapat diselidiki.','**S2 (Salah):** Benedict menguji gula pereduksi, bukan protein (protein diuji dengan Biuret).','**S3 (Benar):** pemanasan adalah bagian prosedur uji sehingga pertanyaan tentang pengaruhnya dapat dirumuskan dan diuji.'],{cat:['Pertanyaan','Benar','Salah'],rows:['Apakah madu mengandung gula pereduksi lebih banyak daripada susu?','Apakah warna merah bata menunjukkan adanya protein pada madu?','Bagaimana pengaruh pemanasan terhadap perubahan warna larutan Benedict pada bahan makanan?']}),
mk(15,'PG','Keterampilan Proses',['Murid menguji hipotesis "Semakin banyak pupuk diberikan, semakin tinggi tanaman". Hasil tinggi tanaman setelah 3 minggu disajikan pada tabel.'],['Pernyataan yang paling tepat menghubungkan data dengan hipotesis adalah ....'],['hipotesis didukung penuh karena semua dosis pupuk meningkatkan tinggi tanaman','hipotesis ditolak karena tanaman tanpa pupuk tetap tumbuh','hipotesis didukung sebagian: tinggi meningkat sampai 10 g, lalu menurun pada 15 g','hipotesis tidak dapat diuji karena hanya satu variabel','hipotesis didukung karena dosis 15 g menghasilkan tanaman tertinggi'],2,['Tinggi meningkat dari 0 g ke 10 g (12 ke 25 cm) tetapi turun pada 15 g (15 cm), mungkin karena kelebihan pupuk. Jadi hubungan tidak terus meningkat dan hipotesis hanya didukung sebagian.'],{table:{header:['Dosis pupuk (g)','Tinggi tanaman (cm)'],rows:[['0','12'],['5','18'],['10','25'],['15','15']]}})
];
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
function localSave(name,html){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function saveHtml(name,html){try{if(typeof claude==='undefined'){localSave(name,html);return}const d=await claude.use('downloads');if(!d){alert('Fitur unduh tidak tersedia di tampilan ini.');return}await d.save({filename:name,data:html})}catch(e){if(!e||e.code!=='declined')alert('Gagal mengunduh: '+((e&&e.message)||e))}}
function exportHasil(){const c=$('#app').cloneNode(true);c.querySelectorAll('.nonprint').forEach(e=>e.remove());const nm=S.user.nama.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'siswa';saveHtml('Hasil_TryOut_TKA_Biologi_'+nm+'.html','<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hasil Try Out TKA Biologi - '+esc(S.user.nama)+'</title><style>'+document.querySelector('style').textContent+'</style></head><body><div class="wrap">'+c.innerHTML+'</div><div class="foot">Dikembangkan oleh <b>Bilkis Nur Izzaty, S.Pd.</b> • SMAN 2 Kalianda</div></body></html>')}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
let S={user:null,i:0,ans:[],flag:[],left:DUR,timer:null,done:false};
function initS(d,name){DATA=d;DUR=d===DATA2?3000:5400;S={user:null,i:0,ans:[],flag:[],left:DUR,timer:null,done:false,name};DATA.forEach((q,k)=>{S.ans[k]=q.type==='PG'?null:q.type==='MCMA'?[]:q.rows.map(()=>null);S.flag[k]=false})}
function menu(){
 $('#app').innerHTML=`<div class="hero"><div style="font-size:2.4rem">🧬</div><h1>Pendalaman TKA Biologi</h1><p>SMA/MA/SMK • Pilih paket latihan</p></div><div class="menu">${[[DATA1,'Try Out 1','Soal TKA Biologi 2025',90],[DATA2,'Try Out 2','Soal serupa dengan materi baru',50]].map((m,x)=>`<div class="card"><h2 style="margin-top:0">${m[1]}</h2><p>${m[2]}</p><div class="info"><span>📝 ${m[0].length} soal</span><span>⏱️ ${m[3]} menit</span></div><button class="btn big" data-x="${x}">Mulai ${m[1]}</button></div>`).join('')}</div>`;
 document.querySelectorAll('.menu .btn').forEach(b=>b.onclick=()=>{const x=+b.dataset.x;initS(x?DATA2:DATA1,'Try Out '+(x+1));start()})}
const answered=k=>{const q=DATA[k],a=S.ans[k];return q.type==='PG'?a!==null:q.type==='MCMA'?a.length>0:a.every(x=>x!==null)};
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');

function start(){
  $('#app').innerHTML=`<div class="hero"><div style="font-size:2.4rem">🧬</div><h1>Pendalaman TKA Biologi</h1><p>${S.name} • SMA/MA/SMK • ${DATA.length} soal • ${DUR/60} menit</p></div>
  <div class="card"><h2 style="margin-top:0">Data Peserta</h2>
  <label>Nama Siswa</label><input id="f_nama" placeholder="Nama lengkap" autocomplete="off">
  <label>Kelas</label><input id="f_kelas" placeholder="Contoh: XII IPA 1" autocomplete="off">
  <label>Nomor Peserta Didik (NISN/No. Peserta)</label><input id="f_nis" placeholder="Nomor peserta didik" autocomplete="off">
  <label>Asal Sekolah</label><input id="f_sekolah" placeholder="Nama sekolah" autocomplete="off">
  <div class="info"><span>⏱️ Waktu ${DUR/60} menit</span><span>📝 ${DATA.length} soal</span><span>🚩 Tersedia tombol ragu-ragu</span></div>
  <p id="err" style="color:var(--bad);margin:10px 0 0"></p>
  <button class="btn big" id="go">Mulai Try Out</button><button class="btn ghost" id="dlapp" style="width:100%;margin-top:10px">💾 Unduh Aplikasi (HTML)</button><button class="btn ghost" id="back" style="width:100%;margin-top:10px">← Pilih Try Out</button></div>`;
  $('#dlapp').onclick=()=>saveHtml('Pendalaman_TKA_Biologi.html',SRC);$('#back').onclick=menu;$('#go').onclick=()=>{const u={nama:$('#f_nama').value.trim(),kelas:$('#f_kelas').value.trim(),nis:$('#f_nis').value.trim(),sekolah:$('#f_sekolah').value.trim()};
    if(!u.nama||!u.kelas||!u.nis||!u.sekolah){$('#err').textContent='Mohon lengkapi semua data peserta.';return}
    S.user=u;S.timer=setInterval(()=>{S.left--;const t=$('#tm');if(t){t.textContent=fmt(S.left);t.classList.toggle('low',S.left<=300)}if(S.left<=0)finish()},1000);exam()};
}
function qHtml(k){
  const q=DATA[k];let h=`<div class="q"><span class="tag">Soal ${k+1} / ${DATA.length}</span><span class="tag">${esc(q.el)}</span>`;
  (q.stem||[]).forEach(s=>h+=`<p>${md(s)}</p>`);
  if(q.fig)h+=`<img src="${q.fig}" alt="Gambar soal ${k+1}">`;
  if(q.table){h+=`<div class="wide"><table class="t"><tr>${q.table.header.map(c=>`<th>${md(c)}</th>`).join('')}</tr>`+q.table.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')+`</table></div>`}
  (q.stem2||[]).forEach(s=>h+=`<p>${md(s)}</p>`);
  (q.ask||[]).forEach(s=>h+=`<p class="ask">${md(s)}</p>`);
  const a=S.ans[k];
  if(q.type==='KAT'){h+=`<div class="wide"><table class="t kat" style="width:100%"><tr><th>${md(q.cat[0])}</th><th class="c">${q.cat[1]}</th><th class="c">${q.cat[2]}</th></tr>`+q.rows.map((r,j)=>`<tr><td>${md(r)}</td>`+[0,1].map(v=>`<td class="c"><input type="radio" name="r${j}" data-j="${j}" data-v="${v}" ${a[j]===v?'checked':''}></td>`).join('')+'</tr>').join('')+'</table></div>'}
  else q.opts.forEach((o,j)=>{const sel=q.type==='PG'?a===j:a.includes(j);h+=`<label class="opt ${sel?'sel':''}"><input type="${q.type==='PG'?'radio':'checkbox'}" name="o" data-j="${j}" ${sel?'checked':''}><span><b>${q.type==='PG'?L[j]+'.':''}</b> ${md(o)}</span></label>`});
  return h+'</div>';
}
function exam(){
  const k=S.i,last=k===DATA.length-1,a=DATA.filter((_,x)=>answered(x)).length;
  $('#app').innerHTML=`<div class="bar"><div><b>${esc(S.user.nama)}</b><small>${esc(S.user.kelas)} • ${esc(S.user.sekolah)}</small></div><div class="timer ${S.left<=300?'low':''}" id="tm">${fmt(S.left)}</div></div>
  <div class="grid"><div class="card">${qHtml(k)}
   <div class="nav"><button class="btn ghost" id="prev" ${k===0?'disabled':''}>◀ Sebelumnya</button>
   <button class="btn warn" id="flag">${S.flag[k]?'🚩 Batal Ragu-ragu':'🚩 Ragu-ragu'}</button>
   ${last?'<button class="btn" id="fin">Selesai ✔</button>':'<button class="btn" id="next">Selanjutnya ▶</button>'}</div></div>
  <div class="card" style="margin-top:0"><b>Navigasi Soal</b><div class="numgrid" style="margin-top:10px">${DATA.map((_,x)=>`<button class="num ${S.flag[x]?'flag':answered(x)?'ans':''} ${x===k?'cur':''}" data-x="${x}">${x+1}</button>`).join('')}</div>
   <div class="leg"><span><i style="background:var(--ok)"></i>Sudah dijawab</span><span><i style="background:var(--warn)"></i>Ragu-ragu</span><span><i style="background:var(--un)"></i>Belum dijawab</span></div>
   <p style="color:var(--muted);font-size:.88rem">Terjawab: ${a} / ${DATA.length}</p><button class="btn big" id="fin2" style="margin-top:6px">Selesaikan Try Out</button></div></div>`;
  document.querySelectorAll('.opt input').forEach(el=>el.onchange=()=>{const j=+el.dataset.j,q=DATA[k];if(q.type==='PG')S.ans[k]=j;else{const s=S.ans[k],p=s.indexOf(j);p<0?s.push(j):s.splice(p,1)}exam()});
  document.querySelectorAll('.kat input').forEach(el=>el.onchange=()=>{S.ans[k][+el.dataset.j]=+el.dataset.v;exam()});
  document.querySelectorAll('.num').forEach(b=>b.onclick=()=>{S.i=+b.dataset.x;exam();scrollTo(0,0)});
  $('#prev').onclick=()=>{S.i--;exam();scrollTo(0,0)};
  $('#flag').onclick=()=>{S.flag[k]=!S.flag[k];exam()};
  if($('#next'))$('#next').onclick=()=>{S.i++;exam();scrollTo(0,0)};
  [$('#fin'),$('#fin2')].forEach(b=>b&&(b.onclick=confirmEnd));
}
function confirmEnd(){
  const n=DATA.length,a=DATA.filter((_,x)=>answered(x)).length,f=S.flag.filter(Boolean).length;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">Akhiri Try Out?</h3><p>Terjawab: <b>${a}</b> • Belum dijawab: <b>${n-a}</b> • Ragu-ragu: <b>${f}</b></p><div class="nav"><button class="btn ghost" id="no">Kembali</button><button class="btn" id="yes">Ya, Selesai</button></div></div>`;
  document.body.appendChild(m);$('#no').onclick=()=>m.remove();$('#yes').onclick=()=>{m.remove();finish()};
}
function same(x,y){return JSON.stringify(x)===JSON.stringify(y)}
function correct(k){const q=DATA[k],a=S.ans[k];return q.type==='MCMA'?same([...a].sort(),[...q.ans].sort()):same(a,q.ans)}
function ansText(k,v){const q=DATA[k];
  if(q.type==='PG')return v===null?'<i>Tidak dijawab</i>':`${L[v]}. ${md(q.opts[v])}`;
  if(q.type==='MCMA')return v.length?[...v].sort().map(j=>`${L[j]}. ${md(q.opts[j])}`).join('<br>'):'<i>Tidak dijawab</i>';
  return q.rows.map((r,j)=>`${j+1}. ${v[j]===null?'<i>—</i>':q.cat[v[j]+1]}`).join('<br>')}
function finish(){
  if(S.done)return;S.done=true;clearInterval(S.timer);
  const n=DATA.length,ok=DATA.filter((_,k)=>correct(k)).length,un=DATA.filter((_,k)=>!answered(k)).length,score=Math.round(ok/n*1000)/10,u=S.user;
  const used=DUR-Math.max(S.left,0);
  $('#app').innerHTML=`<div class="hero"><h1>Pendalaman TKA Biologi</h1><p>Hasil ${S.name} • ${esc(u.nama)} • ${esc(u.kelas)}</p></div>
  <div class="card" style="text-align:center"><div class="score" style="--p:${score}"><b>${score}</b><span style="color:var(--muted)">Nilai Akhir</span></div>
   <div class="stats"><div><b style="color:var(--ok)">${ok}</b>Benar</div><div><b style="color:var(--bad)">${n-ok-un}</b>Salah</div><div><b>${un}</b>Kosong</div><div><b>${fmt(used)}</b>Waktu</div></div>
   <table class="t" style="margin-top:16px;text-align:left"><tr><th>Nama</th><td>${esc(u.nama)}</td></tr><tr><th>Kelas</th><td>${esc(u.kelas)}</td></tr><tr><th>No. Peserta Didik</th><td>${esc(u.nis)}</td></tr><tr><th>Asal Sekolah</th><td>${esc(u.sekolah)}</td></tr></table>
   <div class="nav nonprint" style="justify-content:center"><button class="btn" onclick="exportHasil()">💾 Unduh Hasil (HTML)</button><button class="btn" onclick="print()">🖨️ Cetak / Simpan PDF</button><button class="btn ghost" onclick="location.reload()">🔄 Ulangi</button></div></div>
  <h2 style="margin:22px 4px 0">Pembahasan Soal</h2>`+DATA.map((q,k)=>{const c=correct(k);
   return `<div class="card rv ${c?'ok':'no'}">${qHtml(k).replace(/<label class="opt[^>]*>/g,'<div class="opt">').replace(/<\/label>/g,'</div>').replace(/<input[^>]*>/g,'')}
   <span class="badge ${c?'ok':'no'}">${c?'✔ Benar':'✘ Salah / Kosong'}</span>
   <p><b>Jawabanmu:</b><br>${ansText(k,S.ans[k])}</p>
   <div class="kunci"><b>Kunci:</b><br>${ansText(k,q.ans)}</div>
   <div class="bahas"><b>Pembahasan</b>${q.ex.map(e=>`<p style="margin:.4em 0">${md(e)}</p>`).join('')}</div></div>`}).join('');
  scrollTo(0,0);
}
menu();
</script></body></html>
